<!doctype html>
<html lang="en">
<head>
  <script data-tsc-mobile-boot>
    (function () {
      var mq = window.matchMedia && window.matchMedia('(max-width: 1024px)');
      if (!mq || !mq.matches) return;
      document.documentElement.classList.add('tsc-boot-mobile', 'tsc-mobile-ready', 'tsc-skel-revealed');
      function link(href) {
        if (document.querySelector('link[data-tsc-boot][href="' + href + '"]')) return;
        var el = document.createElement('link');
        el.rel = 'stylesheet';
        el.href = href;
        el.media = '(max-width: 1024px)';
        el.setAttribute('data-tsc-boot', '1');
        (document.head || document.documentElement).appendChild(el);
      }
      link('/css/mobile/boot.css?v=mobile-own-1');
      link('/css/tsc-mobile-system.css?v=mobile-own-1');
      link('/css/mobile/course-bundle.css?v=bundle-desktop-shell-1');
    })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Courses Bundle | TSC Academy</title>
  <meta name="description" content="Get all three TSC Academy courses in one bundle for INR 9,999, reduced from INR 12,000.">
  <link rel="stylesheet" href="/css/pages/the-heart-of-composition.css">
  <link rel="stylesheet" href="/css/pages/course-bundle.css?v=bundle-desktop-shell-1">
  <link rel="stylesheet" href="/css/tsc-nav-overrides.css?v=courses-dropdown-1">
  <link rel="stylesheet" href="/css/tsc-responsive.css?v=courses-roots-click-1">
  <link rel="stylesheet" href="/css/tsc-mobile-system.css?v=kill-ads-strip-2" media="(max-width: 1024px)">
  <link rel="stylesheet" href="/css/mobile/course-bundle.css?v=bundle-desktop-shell-1" media="(max-width: 1024px)">
  <link rel="icon" href="/assets/brand/academy-favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/brand/academy-apple-touch-icon.png" sizes="180x180">
</head>
<body data-page="course-bundle">
  <main data-main-content-parent="true"></main>

  <script defer src="/js/tsc-mobile-route-map.js?v=mobile-own-1"></script>
  <script src="/js/tsc-components.js?v=bundle-desktop-shell-1" defer></script>
</body>
</html>
