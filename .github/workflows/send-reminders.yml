name: Send WhatsApp Reminders

on:
  schedule:
    # Runs every 30 minutes
    - cron: '0,30 * * * *'
  workflow_dispatch: 

jobs:
  ping-reminder-api:
    runs-on: ubuntu-latest
    steps:
      - name: Hit Reminder API
        run: |
          # Follow redirects (-L) and use a browser-like User-Agent to avoid 'Lander' parking pages
          # Hit the correct Next.js production API
          curl -L -X GET "https://theshakticollective.in/api/check-reminders" \
               -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
               -H "Accept: application/json"
