  <script data-tsc-mobile-boot>
    (function () {
      var mq = window.matchMedia && window.matchMedia('(max-width: 1024px)');
      if (!mq || !mq.matches) return;
      document.documentElement.classList.add('tsc-boot-mobile', 'tsc-mobile-ready', 'tsc-skel-revealed');
      function link(href) {
        if (document.querySelector('link[data-tsc-boot][href="' + href + '"]')) return;
        var el = document.createElement('link');
        el.rel = 'stylesheet';
        el.href = href;
        el.media = '(max-width: 1024px)';
        el.setAttribute('data-tsc-boot', '1');
        (document.head || document.documentElement).appendChild(el);
      }
      link('/css/mobile/boot.css?v=mobile-own-1');
      link('/css/tsc-mobile-system.css?v=mobile-own-1');
      link('/css/mobile/course-bundle.css?v=bundle-desktop-shell-1');
    })();
  </script>
